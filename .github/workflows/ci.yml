name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://tulip:tulip@localhost:5432/tulip_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tulip
          POSTGRES_PASSWORD: tulip
          POSTGRES_DB: tulip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tulip -d tulip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify core behavior
        run: npm run verify:core

      - name: Verify PostgreSQL integration
        run: npm run test:postgres

      - name: Verify offline web types
        run: npm run typecheck:web:offline

      - name: Verify full workspace
        run: pnpm verify
