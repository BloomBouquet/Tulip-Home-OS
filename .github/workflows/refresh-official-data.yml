name: Refresh official data

on:
  workflow_dispatch:
  schedule:
    # 03:10 Asia/Seoul (18:10 UTC on the previous calendar day)
    - cron: '10 18 * * *'

permissions:
  contents: read

concurrency:
  group: official-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.TULIP_PUBLIC_DATA_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TULIP_SSH_HOST: ${{ vars.TULIP_SSH_HOST }}
      TULIP_SSH_PORT: ${{ vars.TULIP_SSH_PORT }}
      TULIP_SSH_USER: ${{ vars.TULIP_SSH_USER }}
      TULIP_SSH_PRIVATE_KEY: ${{ secrets.TULIP_SSH_PRIVATE_KEY }}
      TULIP_SSH_KNOWN_HOSTS: ${{ secrets.TULIP_SSH_KNOWN_HOSTS }}

    steps:
      - name: Trigger server-local refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${TULIP_SSH_HOST:?TULIP_SSH_HOST is required}"
          : "${TULIP_SSH_PORT:?TULIP_SSH_PORT is required}"
          : "${TULIP_SSH_USER:?TULIP_SSH_USER is required}"
          : "${TULIP_SSH_PRIVATE_KEY:?TULIP_SSH_PRIVATE_KEY is required}"
          : "${TULIP_SSH_KNOWN_HOSTS:?TULIP_SSH_KNOWN_HOSTS is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$TULIP_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_tulip"
          chmod 600 "$HOME/.ssh/id_tulip"
          printf '%s\n' "$TULIP_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/id_tulip" \
            -p "$TULIP_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            "${TULIP_SSH_USER}@${TULIP_SSH_HOST}" \
            "/srv/tulip-home-os/scripts/server/refresh-official-data.sh"
